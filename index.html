<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>運動教室 出欠ポータル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <main class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-6 sm:p-8 space-y-6">
    <div class="text-center space-y-2">
      <span class="text-4xl">🏃‍♂️</span>
      <h1 class="text-xl sm:text-2xl font-black text-slate-900">運動教室 出欠管理ポータル</h1>
      <p class="text-xs text-slate-500 font-bold">ご利用の画面を選択してください</p>
    </div>

    <div class="space-y-3">
      <!-- 生徒用ボタン -->
      <a href="student.html" class="block p-4 rounded-2xl bg-amber-500 hover:bg-amber-600 active:scale-95 text-white shadow-md transition">
        <div class="flex items-center gap-3">
          <span class="text-3xl">🏃‍♂️</span>
          <div class="text-left">
            <div class="text-xs font-bold text-amber-100">子ども用</div>
            <div class="text-base font-black">れんしゅう出欠チェック</div>
          </div>
        </div>
      </a>

      <!-- 保護者用ボタン -->
      <a href="parent.html" class="block p-4 rounded-2xl bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white shadow-md transition">
        <div class="flex items-center gap-3">
          <span class="text-3xl">👨‍👩‍👧</span>
          <div class="text-left">
            <div class="text-xs font-bold text-indigo-200">お父さん・お母さん用</div>
            <div class="text-base font-black">保護者ポータル（2週間カレンダー）</div>
          </div>
        </div>
      </a>

      <!-- 指導者用ボタン -->
      <a href="coach.html" class="block p-4 rounded-2xl bg-slate-900 hover:bg-slate-800 active:scale-95 text-white shadow-md transition">
        <div class="flex items-center gap-3">
          <span class="text-3xl">📋</span>
          <div class="text-left">
            <div class="text-xs font-bold text-slate-400">先生・指導者専用</div>
            <div class="text-base font-black">出欠＆練習予定ダッシュボード</div>
          </div>
        </div>
      </a>
    </div>

    <div class="text-center text-[11px] text-slate-400 font-medium">
      ※ 各自の専用ページをブックマークまたはホーム画面に追加しておくと便利です
    </div>
  </main>

</body>
</html>
