<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <script>
    (function () {
      function fitAndroidViewport() {
        var meta = document.querySelector('meta[name="viewport"]');
        if (!meta) return;
        var dpr = window.devicePixelRatio || 1;
        var screenCss = Math.round(Math.min(window.screen.width, window.screen.height) / dpr);
        var layout = document.documentElement.clientWidth || window.innerWidth || 0;
        var scale = window.visualViewport && window.visualViewport.scale ? window.visualViewport.scale : 1;
        var android = /Android/i.test(navigator.userAgent);
        if (screenCss < 280 || screenCss > 540) {
          if (scale < 0.9 && layout > 0) screenCss = Math.round(layout * scale);
        }
        if (screenCss < 280 || screenCss > 540) return;
        if ((android && layout > screenCss * 1.2) || scale < 0.9) {
          var next = 'width=' + screenCss + ', initial-scale=1, minimum-scale=1';
          if (meta.getAttribute('content') !== next) meta.setAttribute('content', next);
        }
      }
      fitAndroidViewport();
      document.addEventListener('DOMContentLoaded', fitAndroidViewport);
      window.addEventListener('load', fitAndroidViewport);
    })();
  </script>
  <title>運動教室 出欠管理ポータル</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    html, body {
      width: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: 'Inter', 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @keyframes toast-pop {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .toast-pop {
      animation: toast-pop 0.28s ease-out;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen overflow-x-hidden overflow-y-auto w-full">

  <div id="toastContainer" class="fixed top-4 inset-x-0 z-50 flex justify-center px-4 pointer-events-none"></div>

  <main class="w-full max-w-md mx-auto px-4 py-8 space-y-4">
    <div class="text-center">
      <div class="w-14 h-14 rounded-2xl bg-white shadow-sm border border-slate-200/80 flex items-center justify-center text-3xl mx-auto mb-3">
        🏃‍♂️
      </div>
      <h1 id="portalTitle" class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">運動教室 出欠管理ポータル</h1>
      <p class="text-xs text-slate-500 font-medium mt-1.5">ご利用の画面を選択してください</p>
    </div>

    <!-- 生徒用 -->
    <section class="w-full bg-white rounded-2xl shadow-sm border border-amber-200/70 overflow-hidden">
      <a href="student.html" class="flex items-center gap-3 p-4 sm:p-5 active:bg-amber-50/50 transition">
        <div class="w-11 h-11 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center text-xl shrink-0 border border-amber-200/80">
          🏃‍♂️
        </div>
        <div class="text-left min-w-0 flex-1 pr-1">
          <div class="text-[11px] font-bold text-amber-700">子ども用・1タップで出席送信</div>
          <div class="text-base sm:text-lg font-black text-slate-900 leading-snug">れんしゅう出欠チェック</div>
        </div>
        <span class="text-slate-300 text-lg font-black shrink-0" aria-hidden="true">›</span>
      </a>
      <div class="border-t border-slate-100 bg-slate-50/60 p-2.5">
        <div class="grid grid-cols-3 gap-2">
          <button type="button" data-action="line" data-file="student.html" data-message="【運動教室】生徒用出欠送信ページです。こちらから出欠を入力してください！" class="share-btn text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200/60 font-bold text-[11px] sm:text-xs py-2.5 rounded-xl flex items-center justify-center gap-1 active:scale-95 transition whitespace-nowrap">
            <span>💬</span><span>LINE</span>
          </button>
          <button type="button" data-action="copy" data-file="student.html" class="share-btn text-slate-700 bg-white hover:bg-slate-100 border border-slate-200 font-bold text-[11px] sm:text-xs py-2.5 rounded-xl flex items-center justify-center gap-1 active:scale-95 transition shadow-sm whitespace-nowrap">
            <span>🔗</span><span>コピー</span>
          </button>
          <button type="button" data-action="qr" data-file="student.html" data-title="生徒用 出欠ページ" class="share-btn text-slate-700 bg-white hover:bg-slate-100 border border-slate-200 font-bold text-[11px] sm:text-xs py-2.5 rounded-xl flex items-center justify-center gap-1 active:scale-95 transition shadow-sm whitespace-nowrap">
            <span>📱</span><span>QR</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 保護者用 -->
    <section class="w-full bg-white rounded-2xl shadow-sm border border-indigo-200/70 overflow-hidden">
      <a href="parent.html" class="flex items-center gap-3 p-4 sm:p-5 active:bg-indigo-50/50 transition">
        <div class="w-11 h-11 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center text-xl shrink-0 border border-indigo-200/80">
          👨‍👩‍👧
        </div>
        <div class="text-left min-w-0 flex-1 pr-1">
          <div class="text-[11px] font-bold text-indigo-600 leading-snug">2週間の練習カレンダー・出欠変更</div>
          <div class="text-base sm:text-lg font-black text-slate-900 leading-snug">保護者ポータル</div>
        </div>
        <span class="text-slate-300 text-lg font-black shrink-0" aria-hidden="true">›</span>
      </a>
      <div class="border-t border-slate-100 bg-slate-50/60 p-2.5">
        <div class="grid grid-cols-3 gap-2">
          <button type="button" data-action="line" data-file="parent.html" data-message="【運動教室】保護者用出欠・予定確認ポータルです。予定の確認や出欠登録はこちらからお願いいたします。" class="share-btn text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200/60 font-bold text-[11px] sm:text-xs py-2.5 rounded-xl flex items-center justify-center gap-1 active:scale-95 transition whitespace-nowrap">
            <span>💬</span><span>LINE</span>
          </button>
          <button type="button" data-action="copy" data-file="parent.html" class="share-btn text-slate-700 bg-white hover:bg-slate-100 border border-slate-200 font-bold text-[11px] sm:text-xs py-2.5 rounded-xl flex items-center justify-center gap-1 active:scale-95 transition shadow-sm whitespace-nowrap">
            <span>🔗</span><span>コピー</span>
          </button>
          <button type="button" data-action="qr" data-file="parent.html" data-title="保護者用ポータル" class="share-btn text-slate-700 bg-white hover:bg-slate-100 border border-slate-200 font-bold text-[11px] sm:text-xs py-2.5 rounded-xl flex items-center justify-center gap-1 active:scale-95 transition shadow-sm whitespace-nowrap">
            <span>📱</span><span>QR</span>
          </button>
        </div>
      </div>
    </section>

    <!-- 指導者用 -->
    <a href="coach.html" class="w-full bg-slate-900 text-white rounded-2xl shadow-sm p-4 active:scale-[0.99] transition flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-11 h-11 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-xl shrink-0">
          📋
        </div>
        <div class="text-left min-w-0 pr-1">
          <div id="coachRoleLabel" class="text-[11px] font-bold text-slate-400">指導者専用</div>
          <div class="text-[15px] sm:text-base font-black leading-snug">出欠＆練習予定ダッシュボード</div>
        </div>
      </div>
      <span class="text-slate-500 text-lg font-black shrink-0" aria-hidden="true">›</span>
    </a>

    <p class="text-xs text-slate-400 text-center font-medium pt-2">
      ※ 各自の専用ページをブックマークまたはホーム画面に追加しておくと便利です
    </p>
  </main>

  <div id="qrModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-md shrink-0 rounded-2xl p-5 space-y-4 shadow-2xl border border-slate-100">
      <div class="flex items-center justify-between gap-3">
        <h2 id="qrModalTitle" class="font-black text-slate-900 text-sm sm:text-base">QRコード</h2>
        <button type="button" id="qrCloseBtn" class="text-slate-400 hover:text-slate-600 text-2xl font-bold leading-none px-1 min-h-[40px] min-w-[40px]" aria-label="閉じる">&times;</button>
      </div>
      <img id="qrImage" alt="共有用QRコード" width="250" height="250" class="mx-auto w-full max-w-[250px] h-auto rounded-xl bg-white border border-slate-100">
      <p id="qrUrlText" class="text-xs text-slate-600 font-medium text-center break-all leading-relaxed"></p>
    </div>
  </div>

  <script>
    const CLUB_NAME = "運動教室"; // 教室名・クラブ名（未設定時の初期値）
    const COACH_TITLE = "コーチ"; // 指導者の呼び名（「コーチ」「指導者」「リーダー」「先生」等）

    function updateClubNameDisplay(name) {
      const next = String(name || '').trim() || CLUB_NAME;
      document.title = `${next} 出欠管理ポータル`;
      document.getElementById('portalTitle').textContent = `${next} 出欠管理ポータル`;
      const studentLine = document.querySelector('[data-action="line"][data-file="student.html"]');
      const parentLine = document.querySelector('[data-action="line"][data-file="parent.html"]');
      if (studentLine) {
        studentLine.dataset.message = `【${next}】生徒用出欠送信ページです。こちらから出欠を入力してください！`;
      }
      if (parentLine) {
        parentLine.dataset.message = `【${next}】保護者用出欠・予定確認ポータルです。予定の確認や出欠登録はこちらからお願いいたします。`;
      }
    }

    document.getElementById('coachRoleLabel').textContent = `${COACH_TITLE}専用`;
    updateClubNameDisplay(CLUB_NAME); // 未取得時は「運動教室」
    subscribeClubName(updateClubNameDisplay);

    function getFullTargetUrl(fileName) {
      const loc = window.location.href.split('?')[0].split('#')[0];
      const base = loc.substring(0, loc.lastIndexOf('/'));
      return `${base}/${fileName}`;
    }

    function copyWithExecCommand(text) {
      const area = document.createElement('textarea');
      area.value = text;
      area.setAttribute('readonly', '');
      area.style.position = 'fixed';
      area.style.top = '0';
      area.style.left = '0';
      area.style.width = '2em';
      area.style.height = '2em';
      area.style.padding = '0';
      area.style.border = 'none';
      area.style.outline = 'none';
      area.style.boxShadow = 'none';
      area.style.background = 'transparent';
      document.body.appendChild(area);
      area.focus();
      area.select();
      area.setSelectionRange(0, area.value.length);
      let copied = false;
      try {
        copied = document.execCommand('copy');
      } catch (err) {
        copied = false;
      }
      document.body.removeChild(area);
      if (copied) return Promise.resolve();
      return Promise.reject(new Error('copy failed'));
    }

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).catch(() => copyWithExecCommand(text));
      }
      return copyWithExecCommand(text);
    }

    function openLineShare(fileName, message) {
      const url = getFullTargetUrl(fileName);
      const text = `${message}\n${url}`;
      const shareUrl = `https://line.me/R/msg/text/?${encodeURIComponent(text)}`;
      window.open(shareUrl, '_blank', 'noopener');
    }

    function openQrModal(fileName, title) {
      const url = getFullTargetUrl(fileName);
      document.getElementById('qrModalTitle').textContent = title || 'QRコード';
      document.getElementById('qrUrlText').textContent = url;
      document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(url)}`;
      const modal = document.getElementById('qrModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeQrModal() {
      const modal = document.getElementById('qrModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    document.addEventListener('click', (event) => {
      const button = event.target.closest('.share-btn');
      if (!button) return;
      const fileName = button.dataset.file;
      const action = button.dataset.action;
      if (action === 'line') {
        openLineShare(fileName, button.dataset.message || '');
        return;
      }
      if (action === 'copy') {
        copyText(getFullTargetUrl(fileName))
          .then(() => showToast('URLをコピーしました！'))
          .catch(() => showToast('コピーに失敗しました'));
        return;
      }
      if (action === 'qr') {
        openQrModal(fileName, button.dataset.title);
      }
    });

    document.getElementById('qrCloseBtn').addEventListener('click', closeQrModal);
    document.getElementById('qrModal').addEventListener('click', (event) => {
      if (event.target.id === 'qrModal') closeQrModal();
    });
  </script>

</body>
</html>
