<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <script>
    (function () {
      function fitAndroidViewport() {
        var meta = document.querySelector('meta[name="viewport"]');
        if (!meta) return;
        var dpr = window.devicePixelRatio || 1;
        var screenCss = Math.round(Math.min(window.screen.width, window.screen.height) / dpr);
        var layout = document.documentElement.clientWidth || window.innerWidth || 0;
        var scale = window.visualViewport && window.visualViewport.scale ? window.visualViewport.scale : 1;
        var android = /Android/i.test(navigator.userAgent);
        if (screenCss < 280 || screenCss > 540) {
          if (scale < 0.9 && layout > 0) screenCss = Math.round(layout * scale);
        }
        if (screenCss < 280 || screenCss > 540) return;
        if ((android && layout > screenCss * 1.2) || scale < 0.9) {
          var next = 'width=' + screenCss + ', initial-scale=1, minimum-scale=1';
          if (meta.getAttribute('content') !== next) meta.setAttribute('content', next);
        }
      }
      fitAndroidViewport();
      document.addEventListener('DOMContentLoaded', fitAndroidViewport);
      window.addEventListener('load', fitAndroidViewport);
    })();
  </script>
  <title>【生徒用】れんしゅう出欠チェック</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    html, body {
      width: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: 'Inter', 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-amber-50 text-slate-800 min-h-screen overflow-x-hidden w-full font-sans">

  <div class="w-full max-w-md mx-auto px-4 py-6 space-y-4">

    <!-- タイトル -->
    <div class="text-center">
      <p id="studentClubName" class="text-[11px] font-black text-amber-800">運動教室</p>
      <h1 class="text-xl sm:text-2xl font-black text-amber-900 tracking-wide flex flex-wrap items-center justify-center gap-2 leading-tight">
        <span>🏃‍♂️</span> <span>れんしゅう出欠チェック</span>
      </h1>
      <p class="text-xs text-amber-700 font-semibold mt-1">なまえをいれて、ボタンをおしてね！</p>
    </div>

    <!-- お名前入力 -->
    <div class="w-full bg-white p-4 rounded-2xl shadow-sm border-2 border-amber-200 space-y-1.5">
      <label class="block text-xs font-bold text-slate-500">なまえ（フルネーム）</label>
      <input type="text" id="studentNameInput" list="studentNameSuggestions" placeholder="例: つもり けんしん" 
        class="w-full text-base sm:text-lg font-black border-2 border-amber-300 rounded-xl px-3 py-2.5 focus:outline-none focus:border-amber-500 bg-amber-50/20">
      <datalist id="studentNameSuggestions"></datalist>
      <div class="text-[11px] text-slate-400">※ お父さん・お母さんと同じ書き方にしてね</div>
    </div>

    <!-- いつの練習か選択 -->
    <div class="w-full bg-white p-4 rounded-2xl shadow-sm border-2 border-amber-200 space-y-2">
      <label class="block text-xs font-bold text-slate-500">いつのれんしゅう？</label>
      <div id="studentDateButtons" class="grid grid-cols-4 sm:grid-cols-7 gap-2 w-full min-w-0 overflow-x-auto"></div>
    </div>

    <div id="studentItemsAlert" class="hidden" role="status"></div>

    <!-- せんせいからのおしらせ（常設） -->
    <div id="studentScheduleBanner" class="w-full p-4 rounded-2xl border-2 border-amber-200 bg-amber-50/80 text-amber-900 shadow-sm" aria-live="polite">
      <div id="studentScheduleTitle" class="font-black text-sm">コーチからのおしらせ</div>
      <div id="studentScheduleBody" class="text-sm mt-1 leading-relaxed">よみこみちゅう...</div>
    </div>

    <!-- でる / やすむ ボタンエリア -->
    <div class="grid grid-cols-2 gap-4 pt-1 w-full min-w-0 overflow-x-auto">
      <button type="button" id="studentAttendBtn" class="min-h-[56px] bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white px-2 py-4 rounded-2xl shadow-md border-b-4 border-emerald-700 flex flex-col items-center justify-center gap-1 transition">
        <span class="text-4xl">⭕</span>
        <span class="text-base sm:text-xl font-black leading-tight text-center">いく（出席）</span>
      </button>

      <button type="button" id="studentAbsentBtn" class="min-h-[56px] bg-rose-500 hover:bg-rose-600 active:scale-95 text-white px-2 py-4 rounded-2xl shadow-md border-b-4 border-rose-700 flex flex-col items-center justify-center gap-1 transition">
        <span class="text-4xl">❌</span>
        <span class="text-base sm:text-xl font-black leading-tight text-center">やすむ（欠席）</span>
      </button>
    </div>

    <!-- 送信結果フィードバック -->
    <div id="studentResultAlert" class="hidden p-4 rounded-xl text-center font-bold text-sm shadow-sm transition"></div>

    <div class="text-center text-xs text-amber-700/70 pt-2 font-medium">
      ※ まちがえておくっても、お父さん・お母さんが後から直せます
    </div>

  </div>

  <script>
    const CLUB_NAME = "運動教室"; // 教室名・クラブ名
    const COACH_TITLE = "コーチ"; // 指導者の呼び名（「コーチ」「指導者」「リーダー」「先生」等）
    const DEFAULT_ANNOUNCEMENT_TITLE = `${COACH_TITLE}からのおしらせ`;
    document.title = `【生徒用】${CLUB_NAME} 出欠チェック`;
    document.getElementById('studentClubName').textContent = CLUB_NAME;
    document.getElementById('studentScheduleTitle').textContent = `${COACH_TITLE}からのおしらせ`;

    const firebaseConfig = {
      apiKey: "AIzaSyAZCVAqpOXMjoKTz99netnxcsr2Yts8Rso",
      authDomain: "attendance-app-3092a.firebaseapp.com",
      projectId: "attendance-app-3092a",
      storageBucket: "attendance-app-3092a.firebasestorage.app",
      messagingSenderId: "1049451840444",
      appId: "1:1049451840444:web:04d60e7e1f486cbffaa633"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const STORAGE_KEY_STUDENT = 'sports_app_student_kid';

    let attendanceMap = {};
    let schedulesMap = {};
    let studentsMap = {};
    let studentTargetDate = '';
    let schedulesReady = false;

    function normalizeDateKey(val) {
      if (!val) return '';
      const s = String(val).trim().replace(/\//g, '-');
      const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) {
        return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
      }
      return s;
    }

    function showStudentError(message) {
      const alertBox = document.getElementById('studentResultAlert');
      alertBox.className = 'p-4 rounded-xl text-center font-bold text-sm bg-rose-100 text-rose-800 block';
      alertBox.textContent = message;
    }

    function applyScheduleSnapshot(snap) {
      const next = {};
      snap.forEach(doc => {
        const item = doc.data() || {};
        const date = normalizeDateKey(item.date || doc.id);
        if (!date) return;
        next[date] = {
          date: date,
          status: item.status || '通常練習',
          isOff: item.status === '休み',
          description: String(item.description || '').trim(),
          itemsToBring: String(item.itemsToBring || '').trim(),
          announcementTitle: String(item.announcementTitle || '').trim()
        };
      });
      schedulesMap = next;
      schedulesReady = true;
      renderDateButtons();
      renderScheduleBanner();
    }

    function applyAttendanceSnapshot(snap) {
      const next = {};
      snap.forEach(doc => {
        const item = doc.data() || {};
        if (!item.name) return;
        const date = normalizeDateKey(item.date);
        next[doc.id] = date ? { ...item, date: date } : item;
      });
      attendanceMap = next;
      renderDateButtons();
    }

    function startLiveSync() {
      db.collection('schedules').onSnapshot(applyScheduleSnapshot, (err) => {
        console.error(err);
        schedulesReady = true;
        renderScheduleBanner();
        showStudentError('予定を読み込めませんでした。通信環境を確認してください。');
      });
      db.collection('attendance').onSnapshot(applyAttendanceSnapshot, (err) => {
        console.error(err);
      });
      db.collection('students').onSnapshot((snap) => {
        const next = {};
        snap.forEach(doc => {
          const item = doc.data() || {};
          if (!item.name) return;
          next[item.normalizedName || doc.id] = item.name;
        });
        studentsMap = next;
        renderNameSuggestions();
      }, (err) => {
        console.error(err);
      });
    }

    async function saveAttendance(name, date, status, note, source) {
      const normalizedName = normalizeName(name);
      const dateStr = normalizeDateKey(date);
      const docId = `${normalizedName}_${dateStr}`;
      await db.collection('attendance').doc(docId).set({
        name: name,
        normalizedName: normalizedName,
        date: dateStr,
        status: status,
        note: note || '',
        source: source,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function normalizeName(name) {
      return (name || '').replace(/[\s\u3000]+/g, '').trim();
    }

    function weekdayLabel(dayIndex) {
      return ['日', '月', '火', '水', '木', '金', '土'][dayIndex];
    }

    function upcomingDays() {
      const days = [];
      for (let offset = 0; offset < 7; offset++) {
        const d = new Date();
        d.setDate(d.getDate() + offset);
        const dateStr = formatDate(d);
        let label = `${d.getMonth() + 1}/${d.getDate()}(${weekdayLabel(d.getDay())})`;
        if (offset === 0) label = 'きょう';
        else if (offset === 1) label = 'あした';
        days.push({ dateStr: dateStr, label: label, day: d.getDay() });
      }
      return days;
    }

    function findOwnAttendance(dateStr) {
      const name = document.getElementById('studentNameInput').value.trim();
      const norm = normalizeName(name);
      const target = normalizeDateKey(dateStr);
      if (!norm || !target) return null;
      const direct = attendanceMap[`${norm}_${target}`];
      if (direct) return direct;
      return Object.values(attendanceMap).find(item => {
        if (!item) return false;
        const itemNorm = item.normalizedName || normalizeName(item.name);
        return itemNorm === norm && normalizeDateKey(item.date) === target;
      }) || null;
    }

    function renderDateButtons() {
      const container = document.getElementById('studentDateButtons');
      const days = upcomingDays();
      if (!days.some(day => day.dateStr === studentTargetDate)) {
        studentTargetDate = days[0].dateStr;
      }

      container.innerHTML = '';
      days.forEach(day => {
        const selected = day.dateStr === studentTargetDate;
        const schedule = schedulesMap[normalizeDateKey(day.dateStr)];
        const record = findOwnAttendance(day.dateStr);
        const off = isPracticeOff(schedule);

        let badge = '';
        if (off) badge = '🚫休';
        else if (record && record.status === '出席') badge = '⭕いく';
        else if (record && record.status === '欠席') badge = '❌やすむ';

        let tone = 'bg-white text-slate-700 border-slate-200';
        if (!selected && day.day === 0) tone = 'bg-white text-rose-600 border-rose-200';
        if (!selected && day.day === 6) tone = 'bg-white text-blue-600 border-blue-200';
        if (selected) tone = 'bg-amber-500 text-white border-amber-600 font-black shadow-md';

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `student-date-btn min-h-[48px] w-full min-w-0 px-1 py-1.5 rounded-xl border-2 text-[11px] sm:text-xs leading-tight transition flex flex-col items-center justify-center gap-0.5 ${tone}`;
        const label = document.createElement('span');
        label.className = 'font-black';
        label.textContent = day.label;
        const mark = document.createElement('span');
        mark.className = `text-[10px] min-h-[14px] font-bold ${selected ? 'text-white' : ''}`;
        mark.textContent = badge;
        btn.append(label, mark);
        btn.onclick = () => {
          studentTargetDate = day.dateStr;
          renderDateButtons();
          renderScheduleBanner();
        };
        container.appendChild(btn);
      });
    }

    function isPracticeOff(schedule) {
      return !!(schedule && (schedule.status === '休み' || schedule.isOff));
    }

    function setStudentActionsLocked(locked) {
      [document.getElementById('studentAttendBtn'), document.getElementById('studentAbsentBtn')].forEach(btn => {
        btn.disabled = locked;
        btn.classList.toggle('opacity-40', locked);
        btn.classList.toggle('cursor-not-allowed', locked);
      });
    }

    function renderStudentItemsAlert(schedule) {
      const alert = document.getElementById('studentItemsAlert');
      const items = schedule && schedule.itemsToBring ? String(schedule.itemsToBring).trim() : '';
      if (!schedulesReady || !items) {
        alert.className = 'hidden';
        alert.textContent = '';
        return;
      }
      const when = normalizeDateKey(studentTargetDate) === formatDate(new Date()) ? 'きょうのもちもの' : 'この日のもちもの';
      alert.className = 'bg-amber-100 border-2 border-amber-400 text-amber-950 p-3.5 rounded-xl font-black flex items-center gap-2 shadow-sm animate-pulse';
      alert.textContent = `🎒【わすれもの注意！】${when}: ${items}`;
    }

    function renderScheduleBanner() {
      const banner = document.getElementById('studentScheduleBanner');
      const title = document.getElementById('studentScheduleTitle');
      const body = document.getElementById('studentScheduleBody');
      const schedule = schedulesMap[normalizeDateKey(studentTargetDate)];
      renderStudentItemsAlert(schedule);

      if (!schedulesReady) {
        banner.className = 'p-4 rounded-2xl border-2 border-amber-200 bg-amber-50/80 text-amber-900 shadow-sm';
        title.className = 'font-black text-sm';
        title.textContent = DEFAULT_ANNOUNCEMENT_TITLE;
        body.className = 'text-sm mt-1 leading-relaxed';
        body.textContent = 'よみこみちゅう...';
        setStudentActionsLocked(true);
        return;
      }

      if (isPracticeOff(schedule)) {
        banner.className = 'p-4 rounded-2xl border-2 bg-rose-100 border-rose-400 text-rose-950 shadow-sm';
        title.className = 'font-black text-base sm:text-lg leading-snug';
        title.textContent = '🚫 この日の れんしゅうは【おやすみ】です';
        body.className = 'text-sm sm:text-base font-bold mt-2 leading-relaxed break-words';
        body.textContent = (schedule.description || '').trim() || 'この日のれんしゅうはお休みです。';
        setStudentActionsLocked(true);
        return;
      }

      if (schedule && (schedule.description || (String(schedule.announcementTitle || '').trim() && String(schedule.announcementTitle).trim() !== DEFAULT_ANNOUNCEMENT_TITLE))) {
        const heading = String(schedule.announcementTitle || '').trim() || DEFAULT_ANNOUNCEMENT_TITLE;
        banner.className = 'p-4 rounded-2xl border-2 bg-blue-50 border-blue-300 text-blue-950 shadow-sm';
        title.className = 'font-black text-base leading-snug';
        title.textContent = `📢 ${heading}`;
        body.className = 'text-sm sm:text-base font-bold mt-2 leading-relaxed break-words';
        body.textContent = schedule.description || '';
        setStudentActionsLocked(false);
        return;
      }

      banner.className = 'p-3 rounded-2xl border-2 border-emerald-200 bg-emerald-50 text-emerald-800 shadow-sm';
      title.className = 'font-bold text-sm';
      title.textContent = '🟢 通常どおり練習があります';
      body.className = 'text-xs mt-1 leading-relaxed';
      body.textContent = '';
      setStudentActionsLocked(false);
    }

    function renderNameSuggestions() {
      const dl = document.getElementById('studentNameSuggestions');
      dl.innerHTML = '';
      Object.values(studentsMap)
        .sort((a, b) => a.localeCompare(b, 'ja'))
        .forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          dl.appendChild(opt);
        });
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function handleStudentSubmit(status) {
      const nameInput = document.getElementById('studentNameInput');
      const name = nameInput.value.trim();
      const alertBox = document.getElementById('studentResultAlert');
      const attendBtn = document.getElementById('studentAttendBtn');
      const absentBtn = document.getElementById('studentAbsentBtn');

      if (attendBtn.disabled || absentBtn.disabled) return;

      if (!name) {
        alertBox.className = 'p-3 rounded-xl text-center font-bold text-sm bg-rose-100 text-rose-800 block';
        alertBox.innerText = '⚠️ おなまえを入力してください！';
        nameInput.focus();
        return;
      }

      localStorage.setItem(STORAGE_KEY_STUDENT, name);
      attendBtn.disabled = true;
      absentBtn.disabled = true;

      try {
        await saveAttendance(name, studentTargetDate, status, '', 'student');
        alertBox.className = 'p-4 rounded-xl text-center font-black text-sm bg-emerald-100 text-emerald-800 block';
        alertBox.innerHTML = `✅ 送信しました！ <b>${escapeHtml(name)}さん</b>、${studentTargetDate} の出欠を【${escapeHtml(status)}】でおくりました！`;
      } catch (err) {
        alertBox.className = 'p-4 rounded-xl text-center font-bold text-sm bg-rose-100 text-rose-800 block';
        alertBox.textContent = `⚠️ おくれませんでした。通信環境を確認してください。`;
        console.error(err);
      } finally {
        renderScheduleBanner();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      studentTargetDate = formatDate(new Date());
      renderDateButtons();
      const saved = localStorage.getItem(STORAGE_KEY_STUDENT);
      if (saved) document.getElementById('studentNameInput').value = saved;
      document.getElementById('studentNameInput').addEventListener('input', renderDateButtons);

      document.getElementById('studentAttendBtn').addEventListener('click', () => handleStudentSubmit('出席'));
      document.getElementById('studentAbsentBtn').addEventListener('click', () => handleStudentSubmit('欠席'));

      startLiveSync();
    });
  </script>
</body>
</html>
