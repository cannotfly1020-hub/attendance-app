<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <script>
    (function () {
      function fitAndroidViewport() {
        var meta = document.querySelector('meta[name="viewport"]');
        if (!meta) return;
        var dpr = window.devicePixelRatio || 1;
        var screenCss = Math.round(Math.min(window.screen.width, window.screen.height) / dpr);
        var layout = document.documentElement.clientWidth || window.innerWidth || 0;
        var scale = window.visualViewport && window.visualViewport.scale ? window.visualViewport.scale : 1;
        var android = /Android/i.test(navigator.userAgent);
        if (screenCss < 280 || screenCss > 540) {
          if (scale < 0.9 && layout > 0) screenCss = Math.round(layout * scale);
        }
        if (screenCss < 280 || screenCss > 540) return;
        if ((android && layout > screenCss * 1.2) || scale < 0.9) {
          var next = 'width=' + screenCss + ', initial-scale=1, minimum-scale=1';
          if (meta.getAttribute('content') !== next) meta.setAttribute('content', next);
        }
      }
      fitAndroidViewport();
      document.addEventListener('DOMContentLoaded', fitAndroidViewport);
      window.addEventListener('load', fitAndroidViewport);
    })();
  </script>
  <title>【保護者用】運動教室 出欠管理ポータル</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    html, body {
      width: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: 'Inter', 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header {
      padding-top: env(safe-area-inset-top);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16 overflow-x-hidden w-full font-sans">

  <!-- ヘッダー（保護者専用） -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-30">
    <div class="w-full max-w-md mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
      <h1 class="text-base sm:text-lg font-bold flex items-center gap-2 min-w-0 leading-tight break-words">
        <span>🏃‍♂️</span> <span id="parentPortalTitle">運動教室 保護者ポータル</span>
      </h1>
      <span class="text-[11px] bg-indigo-700/80 px-2 py-0.5 rounded-full text-indigo-100 font-semibold flex items-center gap-1 shrink-0">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-300 animate-pulse"></span> 接続中
      </span>
    </div>
  </header>

  <!-- トースト通知 -->
  <div id="toastContainer" class="fixed top-16 left-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <main class="w-full max-w-md mx-auto px-4 py-6 space-y-4">

    <!-- お子さんのお名前入力・固定カード -->
    <section class="w-full bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-x-2 gap-y-1">
        <label class="text-sm font-bold text-slate-600 flex items-center gap-1 min-w-0">
          <span>🧒</span> お子さんのお名前（フルネーム）
        </label>
        <span class="text-xs text-amber-600 font-semibold shrink-0">端末に自動保存</span>
      </div>
      <div class="flex flex-col sm:flex-row gap-2">
        <input type="text" id="studentNameInput" list="registeredStudentNames" placeholder="例: 津守 堅心" 
          class="w-full min-w-0 sm:flex-1 border border-slate-300 rounded-xl px-3 py-2.5 text-base font-bold focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <datalist id="registeredStudentNames"></datalist>
        <button id="saveNameBtn" class="min-h-[48px] bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-4 py-2 rounded-xl active:scale-95 transition shadow-sm shrink-0">
          保存
        </button>
      </div>

      <!-- 過去の登録生徒名クイック選択チップ -->
      <div id="nameChipsArea" class="hidden pt-2 border-t border-slate-100">
        <span class="text-[10px] text-slate-400 block mb-1">登録されている生徒名（タップで即設定）:</span>
        <div id="nameChipsList" class="flex flex-wrap gap-1.5"></div>
      </div>
    </section>

    <!-- 直近の練習予定・休講案内 -->
    <section id="upcomingNotice" class="hidden" aria-live="polite"></section>

    <!-- 向こう2週間の練習日・出欠予定 -->
    <section class="w-full bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex flex-wrap justify-between items-center gap-2 bg-slate-50">
        <div>
          <h2 class="text-sm font-bold text-slate-800">直近2週間の練習日・出欠予定</h2>
          <p class="text-[11px] text-slate-400 mt-0.5">日付をタップすると出欠の変更・理由メモを登録できます</p>
        </div>
      </div>
      <div id="scheduleList" class="divide-y divide-slate-100">
        <div class="p-8 text-center text-slate-400 text-xs">読み込み中...</div>
      </div>
    </section>

  </main>

  <div id="statusModal" class="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-white w-full max-w-md shrink-0 rounded-t-2xl sm:rounded-2xl p-5 space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-2">
        <div>
          <h3 id="modalDateTitle" class="font-bold text-slate-800 text-sm sm:text-base">出欠登録</h3>
        </div>
        <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 text-xl font-bold leading-none">&times;</button>
      </div>

      <div id="modalScheduleNotice" class="hidden rounded-xl border-2 p-3 text-sm leading-relaxed"></div>

      <div class="grid grid-cols-2 gap-3 w-full min-w-0 overflow-x-auto">
        <button type="button" data-val="出席" class="status-choice-btn min-h-[56px] py-3 border-2 border-emerald-500 text-emerald-700 rounded-xl font-bold flex flex-col items-center justify-center hover:bg-emerald-50">
          <span class="text-2xl">⭕</span>
          <span>出席</span>
        </button>
        <button type="button" data-val="欠席" class="status-choice-btn min-h-[56px] py-3 border-2 border-rose-400 text-rose-600 rounded-xl font-bold flex flex-col items-center justify-center hover:bg-rose-50">
          <span class="text-2xl">❌</span>
          <span>欠席</span>
        </button>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">遅刻・早退・欠席理由（任意）</label>
        <input type="text" id="modalNoteInput" placeholder="例: 15分遅れて参加 / 体調不良のため" 
          class="w-full min-w-0 border border-slate-300 rounded-xl px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <button id="submitAttendanceBtn" class="w-full min-h-[48px] bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl active:scale-95 transition flex items-center justify-center gap-2">
        <span>確定して保存</span>
      </button>
    </div>
  </div>

  <script>
    const CLUB_NAME = "運動教室"; // 教室名・クラブ名
    const COACH_TITLE = "コーチ"; // 指導者の呼び名（「コーチ」「指導者」「リーダー」「先生」等）
    const DEFAULT_ANNOUNCEMENT_TITLE = `${COACH_TITLE}からのおしらせ`;
    document.title = `【保護者用】${CLUB_NAME} 出欠管理ポータル`;
    document.getElementById('parentPortalTitle').textContent = `${CLUB_NAME} 保護者ポータル`;

    const firebaseConfig = {
      apiKey: "AIzaSyAZCVAqpOXMjoKTz99netnxcsr2Yts8Rso",
      authDomain: "attendance-app-3092a.firebaseapp.com",
      projectId: "attendance-app-3092a",
      storageBucket: "attendance-app-3092a.firebasestorage.app",
      messagingSenderId: "1049451840444",
      appId: "1:1049451840444:web:04d60e7e1f486cbffaa633"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const STORAGE_KEY_NAME = 'sports_app_parent_kid';

    let attendanceMap = {};
    let schedulesMap = {};
    let studentsMap = {};
    let selectedDate = null;
    let selectedStatus = '出席';

    function normalizeDateKey(val) {
      if (!val) return '';
      const s = String(val).trim().replace(/\//g, '-');
      const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) {
        return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
      }
      return s;
    }

    function refreshParentViews() {
      renderNameChips();
      renderUpcomingNotice();
      renderList();
    }

    function startLiveSync() {
      db.collection('schedules').onSnapshot((snap) => {
        const next = {};
        snap.forEach(doc => {
          const item = doc.data() || {};
          const date = normalizeDateKey(item.date || doc.id);
          if (!date) return;
          next[date] = {
            date: date,
            status: item.status || '通常練習',
            isOff: item.status === '休み',
            description: String(item.description || '').trim(),
            itemsToBring: String(item.itemsToBring || '').trim(),
            announcementTitle: String(item.announcementTitle || '').trim()
          };
        });
        schedulesMap = next;
        refreshParentViews();
      }, (err) => {
        console.error(err);
        showToast('予定を読み込めませんでした。通信環境を確認してください。', true);
      });

      db.collection('attendance').onSnapshot((snap) => {
        const next = {};
        snap.forEach(doc => {
          const item = doc.data() || {};
          if (!item.name) return;
          const date = normalizeDateKey(item.date);
          next[doc.id] = date ? { ...item, date: date } : item;
        });
        attendanceMap = next;
        refreshParentViews();
      }, (err) => {
        console.error(err);
        showToast('出欠を読み込めませんでした。通信環境を確認してください。', true);
      });

      db.collection('students').onSnapshot((snap) => {
        const next = {};
        snap.forEach(doc => {
          const item = doc.data() || {};
          if (!item.name) return;
          next[item.normalizedName || doc.id] = item.name;
        });
        studentsMap = next;
        renderNameChips();
      }, (err) => {
        console.error(err);
      });
    }

    async function saveAttendance(name, date, status, note, source) {
      const normalizedName = normalizeName(name);
      const dateStr = normalizeDateKey(date);
      await db.collection('attendance').doc(`${normalizedName}_${dateStr}`).set({
        name: name,
        normalizedName: normalizedName,
        date: dateStr,
        status: status,
        note: note || '',
        source: source,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    function normalizeName(name) {
      return (name || '').replace(/[\s\u3000]+/g, '').trim();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function getDayLabel(d) {
      return ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
    }

    function showToast(msg, isError = false) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `p-3 rounded-xl shadow-lg border text-xs font-bold pointer-events-auto flex items-start gap-2 ${
        isError ? 'bg-rose-900 text-rose-100 border-rose-700' : 'bg-slate-900 text-white border-slate-700'
      }`;
      const icon = document.createElement('span');
      icon.textContent = isError ? '⚠️' : '✅';
      const text = document.createElement('span');
      text.className = 'leading-relaxed';
      text.textContent = msg;
      toast.append(icon, text);
      container.appendChild(toast);
      setTimeout(() => toast.remove(), isError ? 8000 : 3500);
    }

    function isPracticeOff(schedule) {
      return !!(schedule && (schedule.status === '休み' || schedule.isOff));
    }

    function getSchedule(dateStr) {
      return schedulesMap[normalizeDateKey(dateStr)] || null;
    }

    function findAttendance(normKey, dateStr) {
      const target = normalizeDateKey(dateStr);
      if (!normKey || !target) return null;
      const direct = attendanceMap[`${normKey}_${target}`];
      if (direct) return direct;
      return Object.values(attendanceMap).find(item => {
        if (!item || normalizeDateKey(item.date) !== target) return false;
        const itemNorm = item.normalizedName || normalizeName(item.name);
        return itemNorm === normKey;
      }) || null;
    }

    function renderUpcomingNotice() {
      const el = document.getElementById('upcomingNotice');
      const picks = [];
      for (let offset = 0; offset < 2; offset++) {
        const d = new Date();
        d.setDate(d.getDate() + offset);
        const dateStr = formatDate(d);
        const schedule = getSchedule(dateStr);
        if (!schedule) continue;
        const off = isPracticeOff(schedule);
        const description = (schedule.description || '').trim();
        const items = (schedule.itemsToBring || '').trim();
        const announce = (schedule.announcementTitle || '').trim();
        const customAnnounce = announce && announce !== DEFAULT_ANNOUNCEMENT_TITLE;
        if (!off && !description && !items && !customAnnounce) continue;
        picks.push({
          label: offset === 0 ? '今日' : '明日',
          dateStr: dateStr,
          off: off,
          description: description,
          items: items,
          announce: customAnnounce ? announce : ''
        });
      }

      el.replaceChildren();
      if (picks.length === 0) {
        el.className = 'hidden';
        return;
      }

      const hasOff = picks.some(pick => pick.off);
      el.className = `p-4 rounded-2xl border-2 shadow-sm space-y-3 ${
        hasOff ? 'bg-rose-100 border-rose-400 text-rose-950' : 'bg-blue-50 border-blue-300 text-blue-950'
      }`;

      const heading = document.createElement('div');
      heading.className = 'text-sm sm:text-base font-black';
      heading.textContent = hasOff ? '直近の練習予定・休講案内' : '直近の練習内容・持ち物';
      el.appendChild(heading);

      picks.forEach(pick => {
        const block = document.createElement('div');
        const title = document.createElement('div');
        title.className = 'text-sm font-black leading-snug break-words';
        title.textContent = pick.off
          ? `🚫 ${pick.label}（${pick.dateStr}）は休講です`
          : (pick.announce
            ? `📢 ${pick.announce}（${pick.label}）`
            : `📢 ${pick.label}（${pick.dateStr}）の連絡`);
        block.appendChild(title);
        if (pick.description) {
          const body = document.createElement('div');
          body.className = 'text-sm font-bold mt-1 leading-relaxed break-words';
          body.textContent = pick.description;
          block.appendChild(body);
        }
        if (pick.items) {
          const badge = document.createElement('div');
          badge.className = 'mt-1 text-sm font-black text-amber-950 break-words';
          badge.textContent = `🎒 持ち物: ${pick.items}`;
          block.appendChild(badge);
        }
        el.appendChild(block);
      });
    }

    function renderNameChips() {
      const chipsArea = document.getElementById('nameChipsArea');
      const chipsList = document.getElementById('nameChipsList');
      const datalist = document.getElementById('registeredStudentNames');
      const uniqueNames = new Set(Object.values(studentsMap));

      if (uniqueNames.size === 0) {
        chipsArea.classList.add('hidden');
        chipsList.innerHTML = '';
        datalist.innerHTML = '';
        return;
      }

      chipsArea.classList.remove('hidden');
      chipsList.innerHTML = '';
      datalist.innerHTML = '';

      uniqueNames.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        datalist.appendChild(opt);

        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded-lg border border-slate-300 font-bold active:scale-95 transition';
        chip.textContent = name;
        chip.onclick = () => {
          document.getElementById('studentNameInput').value = name;
          localStorage.setItem(STORAGE_KEY_NAME, name);
          renderUpcomingNotice();
          renderList();
        };
        chipsList.appendChild(chip);
      });
    }

    function renderList() {
      const container = document.getElementById('scheduleList');
      const studentName = document.getElementById('studentNameInput').value.trim();
      const normKey = normalizeName(studentName);

      const days = [];
      const today = new Date();
      for (let i = 0; i < 14; i++) {
        const d = new Date();
        d.setDate(today.getDate() + i);
        days.push({
          dateStr: formatDate(d),
          dayLabel: getDayLabel(d),
          isSunday: d.getDay() === 0,
          isSaturday: d.getDay() === 6
        });
      }

      container.innerHTML = '';

      days.forEach(day => {
        const record = findAttendance(normKey, day.dateStr);
        const schedule = getSchedule(day.dateStr);
        const isOff = isPracticeOff(schedule);

        const row = document.createElement('div');
        row.className = `p-3.5 flex flex-col items-start gap-2 sm:flex-row sm:items-center sm:justify-between transition cursor-pointer ${
          isOff ? 'bg-rose-50 hover:bg-rose-100/70' : 'hover:bg-slate-50'
        }`;
        row.onclick = () => openModal(day.dateStr, record, schedule);

        let statusBadge = '<span class="text-xs px-2.5 py-1 rounded-full bg-slate-100 text-slate-400 font-bold">未登録</span>';
        if (isOff) {
          statusBadge = '<span class="text-xs px-2.5 py-1 rounded-full bg-rose-200 text-rose-950 font-black border border-rose-400">🚫 休講（練習休み）</span>';
        } else if (record) {
          if (record.status === '出席') {
            statusBadge = '<span class="text-xs px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 font-bold border border-emerald-200">⭕ 出席</span>';
          } else if (record.status === '欠席') {
            statusBadge = '<span class="text-xs px-2.5 py-1 rounded-full bg-rose-100 text-rose-800 font-bold border border-rose-200">❌ 欠席</span>';
          }
        }

        const dayColor = day.isSunday ? 'text-rose-600 font-bold' : (day.isSaturday ? 'text-blue-600 font-bold' : 'text-slate-800');

        let descLine = '';
        if (isOff) {
          const reason = schedule.description
            ? escapeHtml(schedule.description)
            : 'この日は練習がありません';
          descLine = `<div class="text-sm font-bold text-rose-950 mt-1 leading-relaxed break-words">${reason}</div>`;
        } else if (schedule && schedule.description) {
          descLine = `<div class="text-xs sm:text-sm text-indigo-600 font-semibold mt-1 leading-relaxed break-words">📌 練習内容: ${escapeHtml(schedule.description)}</div>`;
        }

        if (schedule && (schedule.itemsToBring || '').trim()) {
          descLine += `<div class="mt-1"><span class="bg-amber-100 text-amber-900 border border-amber-300 px-2 py-0.5 rounded-full text-xs font-black inline-flex items-center gap-1">🎒 持ち物: ${escapeHtml(schedule.itemsToBring.trim())}</span></div>`;
        }

        let announceBadge = '';
        const announce = schedule && String(schedule.announcementTitle || '').trim();
        if (announce && announce !== DEFAULT_ANNOUNCEMENT_TITLE) {
          announceBadge = `<span class="bg-purple-100 text-purple-800 text-[10px] px-1.5 py-0.5 rounded font-bold">${escapeHtml(announce)}</span>`;
        }

        let sourceBadge = '';
        if (record && record.source === 'student') {
          sourceBadge = '<span class="text-[10px] bg-amber-100 text-amber-800 border border-amber-200 px-1 py-0.5 rounded font-bold ml-1.5">本人入力</span>';
        } else if (record && record.source === 'coach') {
          sourceBadge = `<span class="text-[10px] bg-slate-100 text-slate-700 border border-slate-300 px-1 py-0.5 rounded font-bold ml-1.5">${COACH_TITLE}</span>`;
        }

        row.innerHTML = `
          <div class="min-w-0 w-full">
            <div class="text-sm flex flex-wrap items-center gap-1.5">
              <span class="${dayColor}">${day.dateStr}</span>
              <span class="text-xs px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-bold">${day.dayLabel}</span>
              ${announceBadge}
              ${sourceBadge}
            </div>
            ${descLine}
            ${record && record.note ? `<div class="text-xs text-slate-500 font-medium mt-0.5 break-words">💬 ${escapeHtml(record.note)}</div>` : ''}
          </div>
          <div class="shrink-0 max-w-full">${statusBadge}</div>
        `;
        container.appendChild(row);
      });
    }

    function openModal(dateStr, currentRecord, schedule) {
      const studentName = document.getElementById('studentNameInput').value.trim();
      if (!studentName) {
        showToast('先にお子さんのお名前を入力・保存してください。', true);
        document.getElementById('studentNameInput').focus();
        return;
      }

      selectedDate = dateStr;
      document.getElementById('modalDateTitle').textContent = `${dateStr} の出欠登録`;

      const notice = document.getElementById('modalScheduleNotice');
      notice.replaceChildren();
      const items = schedule && schedule.itemsToBring ? String(schedule.itemsToBring).trim() : '';
      const announce = schedule ? (String(schedule.announcementTitle || '').trim() || DEFAULT_ANNOUNCEMENT_TITLE) : '';
      const appendSender = () => {
        if (!announce) return;
        const sender = document.createElement('div');
        sender.className = announce === DEFAULT_ANNOUNCEMENT_TITLE
          ? 'font-black text-sm leading-snug break-words'
          : 'inline-flex bg-purple-100 text-purple-800 text-xs px-2 py-0.5 rounded font-black';
        sender.textContent = `📢 ${announce}`;
        notice.prepend(sender);
      };
      const appendItemsWarning = () => {
        if (!items) return;
        const warn = document.createElement('div');
        warn.className = 'font-black text-sm leading-relaxed break-words';
        warn.textContent = `⚠️ 必要持参物: ${items}`;
        notice.prepend(warn);
      };
      if (isPracticeOff(schedule)) {
        notice.className = 'rounded-xl border-2 border-rose-400 bg-rose-100 text-rose-950 p-3 space-y-2';
        const heading = document.createElement('div');
        heading.className = 'font-black text-sm sm:text-base';
        heading.textContent = 'この日は休講日です';
        notice.appendChild(heading);
        const body = document.createElement('div');
        body.className = 'text-sm font-bold mt-1 leading-relaxed break-words';
        body.textContent = (schedule && schedule.description) ? schedule.description : '練習休みのため、出欠の登録は不要です。';
        notice.appendChild(body);
        appendItemsWarning();
        appendSender();
      } else if (schedule && schedule.description) {
        notice.className = 'rounded-xl border-2 border-blue-300 bg-blue-50 text-blue-950 p-3 space-y-2';
        const heading = document.createElement('div');
        heading.className = 'font-black text-sm';
        heading.textContent = '練習内容';
        notice.appendChild(heading);
        const body = document.createElement('div');
        body.className = 'text-sm font-bold mt-1 leading-relaxed break-words';
        body.textContent = schedule.description;
        notice.appendChild(body);
        appendItemsWarning();
        appendSender();
      } else if (items || (announce && announce !== DEFAULT_ANNOUNCEMENT_TITLE)) {
        notice.className = items
          ? 'rounded-xl border-2 border-amber-400 bg-amber-100 text-amber-950 p-3 space-y-2'
          : 'rounded-xl border-2 border-purple-300 bg-purple-50 text-purple-950 p-3 space-y-2';
        appendItemsWarning();
        appendSender();
      } else {
        notice.className = 'hidden';
      }

      selectedStatus = currentRecord ? currentRecord.status : '出席';
      document.getElementById('modalNoteInput').value = currentRecord ? currentRecord.note : '';
      updateModalBtnUI();

      document.getElementById('statusModal').classList.remove('hidden');
    }

    function updateModalBtnUI() {
      document.querySelectorAll('.status-choice-btn').forEach(btn => {
        if (btn.dataset.val === selectedStatus) {
          btn.classList.add('ring-2', 'ring-offset-2', 'ring-indigo-500', 'bg-indigo-50');
        } else {
          btn.classList.remove('ring-2', 'ring-offset-2', 'ring-indigo-500', 'bg-indigo-50');
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem(STORAGE_KEY_NAME);
      if (saved) document.getElementById('studentNameInput').value = saved;

      document.getElementById('saveNameBtn').addEventListener('click', () => {
        const name = document.getElementById('studentNameInput').value.trim();
        if (name) {
          localStorage.setItem(STORAGE_KEY_NAME, name);
          showToast(`お子さんのお名前「${name}」を保存しました`);
          renderList();
        }
      });

      document.getElementById('closeModalBtn').addEventListener('click', () => {
        document.getElementById('statusModal').classList.add('hidden');
      });

      document.querySelectorAll('.status-choice-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedStatus = btn.dataset.val;
          updateModalBtnUI();
        });
      });

      document.getElementById('submitAttendanceBtn').addEventListener('click', async () => {
        const studentName = document.getElementById('studentNameInput').value.trim();
        const note = document.getElementById('modalNoteInput').value.trim();
        const btn = document.getElementById('submitAttendanceBtn');

        if (!studentName || !selectedDate) {
          showToast('先にお子さんのお名前を入力・保存してください。', true);
          return;
        }

        btn.disabled = true;
        btn.innerText = '保存中...';

        try {
          await saveAttendance(studentName, selectedDate, selectedStatus, note, 'parent');
          localStorage.setItem(STORAGE_KEY_NAME, studentName);
          document.getElementById('statusModal').classList.add('hidden');
          showToast(`${selectedDate} の出欠を【${selectedStatus}】で保存しました！`);
        } catch (err) {
          console.error(err);
          showToast('出欠の更新に失敗しました。通信環境を確認してください。', true);
        } finally {
          btn.disabled = false;
          btn.innerText = '確定して保存';
        }
      });

      startLiveSync();
    });
  </script>
</body>
</html>
