  <script>
    (function () {
      function fitAndroidViewport() {
        var meta = document.querySelector('meta[name="viewport"]');
        if (!meta) return;
        var dpr = window.devicePixelRatio || 1;
        var screenCss = Math.round(Math.min(window.screen.width, window.screen.height) / dpr);
        var layout = document.documentElement.clientWidth || window.innerWidth || 0;
        var scale = window.visualViewport && window.visualViewport.scale ? window.visualViewport.scale : 1;
        var android = /Android/i.test(navigator.userAgent);
        if (screenCss < 280 || screenCss > 540) {
          if (scale < 0.9 && layout > 0) screenCss = Math.round(layout * scale);
        }
        if (screenCss < 280 || screenCss > 540) return;
        if ((android && layout > screenCss * 1.2) || scale < 0.9) {
          var next = 'width=' + screenCss + ', initial-scale=1, minimum-scale=1';
          if (meta.getAttribute('content') !== next) meta.setAttribute('content', next);
        }
      }
      fitAndroidViewport();
      document.addEventListener('DOMContentLoaded', fitAndroidViewport);
      window.addEventListener('load', fitAndroidViewport);
    })();
  </script>

  <script>
    const CLUB_NAME = "運動教室"; // 教室名・クラブ名（未設定時の初期値）
    const COACH_TITLE = "コーチ"; // 指導者の呼び名（「コーチ」「指導者」「リーダー」「先生」等）
    const DEFAULT_ANNOUNCEMENT_TITLE = `${COACH_TITLE}からのおしらせ`;
    let activeClubName = CLUB_NAME;
    document.title = `【${COACH_TITLE}専用】出欠＆練習予定ダッシュボード`;
    document.getElementById('coachClubName').textContent = CLUB_NAME;
    document.getElementById('coachPortalTitle').textContent = `【${COACH_TITLE}専用】出欠＆練習予定ダッシュボード`;

    const firebaseConfig = {
      apiKey: "AIzaSyAZCVAqpOXMjoKTz99netnxcsr2Yts8Rso",
      authDomain: "attendance-app-3092a.firebaseapp.com",
      projectId: "attendance-app-3092a",
      storageBucket: "attendance-app-3092a.firebasestorage.app",
      messagingSenderId: "1049451840444",
      appId: "1:1049451840444:web:04d60e7e1f486cbffaa633"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let attendanceMap = {};
    let schedulesMap = {};
    let studentsMap = {};
    let studentsReady = false;
    const ROSTER_SEED_KEY = 'sports_app_students_seeded';
    let currentScheduleStatus = '通常練習';
    let manualSelectedStatus = '出席';
    let scheduleFormDirty = false;

    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function normalizeName(name) {
      return (name || '').replace(/[\s\u3000]+/g, '').trim();
    }

    function showToast(msg, isError = false) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `p-3 rounded-xl shadow-lg border text-xs font-bold pointer-events-auto flex items-start gap-2 ${
        isError ? 'bg-rose-900 text-rose-100 border-rose-700' : 'bg-slate-900 text-white border-slate-700'
      }`;
      const icon = document.createElement('span');
      icon.textContent = isError ? '⚠️' : '✅';
      const text = document.createElement('span');
      text.className = 'leading-relaxed';
      text.textContent = msg;
      toast.append(icon, text);
      container.appendChild(toast);
      setTimeout(() => toast.remove(), isError ? 8000 : 3500);
    }

    function normalizeDateKey(val) {
      if (!val) return '';
      const s = String(val).trim().replace(/\//g, '-');
      const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
      return s;
    }

    function timestampText(value) {
      if (!value) return '';
      if (typeof value === 'string') return value;
      const date = value.toDate ? value.toDate() : null;
      if (!date || Number.isNaN(date.getTime())) return '';
      const pad = (n) => String(n).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function schedulePayload(date, status, description, itemsToBring, announcementTitle) {
      return {
        date: date,
        status: status,
        announcementTitle: announcementTitle || DEFAULT_ANNOUNCEMENT_TITLE,
        description: description || '',
        itemsToBring: itemsToBring || '',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
    }

    async function saveSchedule(date, status, description, itemsToBring, announcementTitle) {
      const dateStr = normalizeDateKey(date);
      await db.collection('schedules').doc(dateStr).set(schedulePayload(dateStr, status, description, itemsToBring, announcementTitle));
    }

    async function saveAttendance(name, date, status, note, source) {
      const normalizedName = normalizeName(name);
      const dateStr = normalizeDateKey(date);
      await db.collection('attendance').doc(`${normalizedName}_${dateStr}`).set({
        name: name,
        normalizedName: normalizedName,
        date: dateStr,
        status: status,
        note: note || '',
        source: source,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    function updateClubNameDisplay(name) {
      const next = String(name || '').trim() || CLUB_NAME;
      activeClubName = next;
      document.getElementById('coachClubName').textContent = next;
      const input = document.getElementById('clubNameInput');
      if (input && document.activeElement !== input) input.value = next;
    }

        updateClubNameDisplay(data.clubName || CLUB_NAME);
      }, (err) => {
        console.error(err);
        updateClubNameDisplay(CLUB_NAME);
      });

      db.collection('schedules').onSnapshot((snap) => {
        const next = {};
        snap.forEach(doc => {
          const item = doc.data() || {};
          const date = normalizeDateKey(item.date || doc.id);
          if (!date) return;
          next[date] = {
            date: date,
            status: item.status || '通常練習',
            description: item.description || '',
            itemsToBring: String(item.itemsToBring || '').trim(),
            announcementTitle: String(item.announcementTitle || '').trim()
          };
        });
        schedulesMap = next;
        renderDashboard();

      });

      db.collection('attendance').onSnapshot((snap) => {
        const next = {};
        snap.forEach(doc => {
          const item = doc.data() || {};
          if (!item.name) return;
          const date = normalizeDateKey(item.date);
          next[doc.id] = {
            ...item,
            docId: doc.id,
            date: date,
            updatedAt: timestampText(item.updatedAt)
          };
        });
        attendanceMap = next;
        renderDashboard();
      }, (err) => {
        console.error(err);
        showToast('出欠を読み込めませんでした。通信環境を確認してください。', true);
      });

      db.collection('students').onSnapshot((snap) => {
        const next = {};
        snap.forEach(doc => {
          const item = doc.data() || {};
          const normalizedName = item.normalizedName || doc.id;
          if (!item.name || !normalizedName) return;
          next[normalizedName] = {
            name: item.name,
            normalizedName: normalizedName
          };

        studentsMap = next;
        studentsReady = true;
        populateDatalist();

    async function seedStudentsFromAttendance() {
      if (!studentsReady || localStorage.getItem(ROSTER_SEED_KEY) === '1') return;
      if (Object.keys(studentsMap).length > 0) {
        localStorage.setItem(ROSTER_SEED_KEY, '1');
        return;
      }
      const seen = new Set();
      const batch = db.batch();
      let count = 0;
      Object.values(attendanceMap).forEach(item => {
        const name = (item && item.name ? item.name : '').trim();
        const normalizedName = (item && item.normalizedName) || normalizeName(name);
        if (!name || !normalizedName || name === '【練習予定】' || seen.has(normalizedName)) return;
        seen.add(normalizedName);
        batch.set(db.collection('students').doc(normalizedName), {
          name: name,
          normalizedName: normalizedName,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        count += 1;
      });
      if (count > 0) await batch.commit();
      localStorage.setItem(ROSTER_SEED_KEY, '1');
    }

    function csvCell(value) {
      const text = String(value ?? '');
      if (/[",\n\r]/.test(text)) return `"${text.replace(/"/g, '""')}"`;
      return text;
    }

    function downloadAttendanceCsv() {
      const rows = Object.values(attendanceMap).sort((a, b) => {
        const byDate = String(a.date || '').localeCompare(String(b.date || ''));
        if (byDate !== 0) return byDate;
        return String(a.name || '').localeCompare(String(b.name || ''), 'ja');
      });
      if (rows.length === 0) {
        showToast('出力できる出欠データがありません。', true);
        return;
      }
      const lines = ['日付,生徒名,出欠,理由/メモ,登録元,登録日時'];
      rows.forEach(item => {
        lines.push([
          item.date || '',
          item.name || '',
          item.status || '',
          item.note || '',
          item.source || '',
          item.updatedAt || ''
        ].map(csvCell).join(','));
      });
      const today = formatDate(new Date()).replace(/-/g, '');
      const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
      const blob = new Blob([bom, lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${activeClubName}_出欠集計_${today}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast('出欠CSVをダウンロードしました！');
    }

      function addDays(dateStr, days) {
        const [y, m, d] = String(dateStr).split('-').map(Number);
        const date = new Date(y, m - 1, d);
        date.setDate(date.getDate() + days);
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      function askCopyConfirm(message) {
        return new Promise(resolve => {
          const modal = document.getElementById('copyConfirmModal');
          document.getElementById('copyConfirmText').textContent = message;
          modal.classList.remove('hidden');
          modal.classList.add('flex');
          const okBtn = document.getElementById('copyConfirmOk');
          const cancelBtn = document.getElementById('copyConfirmCancel');
          const finish = (value) => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            okBtn.onclick = null;
            cancelBtn.onclick = null;
            resolve(value);
          };
          okBtn.onclick = () => finish(true);
          cancelBtn.onclick = () => finish(false);
        });
      }

      document.getElementById('copyScheduleBtn').addEventListener('click', (event) => {
        event.stopPropagation();
        document.getElementById('copyScheduleMenu').classList.toggle('hidden');

      document.addEventListener('click', (event) => {

          const items = document.getElementById('schItemsInput').value.trim();
          const announcementTitle = document.getElementById('schAnnounceInput').value.trim() || DEFAULT_ANNOUNCEMENT_TITLE;
          const status = currentScheduleStatus;
          const isNextWeek = option.dataset.copy === 'next-week';
          const targets = isNextWeek
            ? [addDays(sourceDate, 7)]
            : Array.from({ length: 7 }, (_, i) => addDays(sourceDate, i));
          const message = isNextWeek
            ? `${sourceDate} の設定を、来週の ${targets[0]} にコピーして保存しますか？`
            : `${sourceDate} の設定を、向こう7日間（${targets[0]}〜${targets[targets.length - 1]}）すべてにコピーして保存しますか？`;

        } catch (err) {
          console.error(err);
          showToast('登録に失敗しました。通信環境を確認してください。', true);
        } finally {
          btn.disabled = false;
          btn.innerText = '保存して反映';
        }
      });

      startLiveSync();
    });
  </script>
</body>
</html>
