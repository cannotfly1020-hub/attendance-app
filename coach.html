<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
  <script>
    (function () {
      function fitAndroidViewport() {
        var meta = document.querySelector('meta[name="viewport"]');
        if (!meta) return;
        var dpr = window.devicePixelRatio || 1;
        var screenCss = Math.round(Math.min(window.screen.width, window.screen.height) / dpr);
        var layout = document.documentElement.clientWidth || window.innerWidth || 0;
        var scale = window.visualViewport && window.visualViewport.scale ? window.visualViewport.scale : 1;
        var android = /Android/i.test(navigator.userAgent);
        if (screenCss < 280 || screenCss > 540) {
          if (scale < 0.9 && layout > 0) screenCss = Math.round(layout * scale);
        }
        if (screenCss < 280 || screenCss > 540) return;
        if ((android && layout > screenCss * 1.2) || scale < 0.9) {
          var next = 'width=' + screenCss + ', initial-scale=1, minimum-scale=1';
          if (meta.getAttribute('content') !== next) meta.setAttribute('content', next);
        }
      }
      fitAndroidViewport();
      document.addEventListener('DOMContentLoaded', fitAndroidViewport);
      window.addEventListener('load', fitAndroidViewport);
    })();
  </script>
  <title>【指導者専用】出欠＆練習予定ダッシュボード</title>
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    html, body {
      width: 100%;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }
    body {
      font-family: 'Inter', 'M PLUS Rounded 1c', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    header {
      padding-top: env(safe-area-inset-top);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-16 overflow-x-hidden w-full font-sans">

  <!-- ヘッダー -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30 border-b border-slate-800">
    <div class="w-full max-w-md mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2 min-w-0">
        <span class="text-2xl shrink-0">📋</span>
        <div class="min-w-0">
          <h1 class="text-sm sm:text-lg font-bold leading-snug break-words">出欠＆練習予定管理（指導者用）</h1>
          <span class="text-[11px] text-slate-400 font-semibold">スプレッドシート連携中</span>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button id="refreshBtn" class="min-h-[44px] text-sm bg-slate-800 hover:bg-slate-700 text-white font-bold px-3 py-2 rounded-xl active:scale-95 transition border border-slate-700">
          🔄 最新化
        </button>
        <button id="openManualModalBtn" class="min-h-[44px] text-sm bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-2 rounded-xl active:scale-95 transition shadow">
          ＋ 代理登録
        </button>
      </div>
    </div>
  </header>

  <!-- トースト通知 -->
  <div id="toastContainer" class="fixed top-16 left-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <main class="w-full max-w-md mx-auto px-4 py-6 space-y-6">

    <!-- 日付セレクター＆練習設定カード -->
    <section class="w-full bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div class="flex items-center gap-2 flex-wrap">
          <label class="text-xs font-bold text-slate-500">対象日:</label>
          <input type="date" id="targetDatePicker" class="min-h-[44px] w-full min-w-0 max-w-full border border-slate-300 rounded-xl px-3 py-2 text-base font-bold focus:outline-none focus:ring-2 focus:ring-slate-900 bg-slate-50">
          <button id="setTodayBtn" class="min-h-[44px] px-3 py-2 bg-slate-100 hover:bg-slate-200 text-sm font-bold rounded-lg border border-slate-300 active:scale-95 transition">今日</button>
          <button id="setTomorrowBtn" class="min-h-[44px] px-3 py-2 bg-slate-100 hover:bg-slate-200 text-sm font-bold rounded-lg border border-slate-300 active:scale-95 transition">明日</button>
        </div>
      </div>

      <!-- 練習予定＆休講設定ブロック -->
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
        <div class="flex items-center justify-between flex-wrap gap-2">
          <span class="text-xs font-bold text-slate-700 flex items-center gap-1">
            <span>⚙️</span> この日の練習設定
          </span>
          <div class="flex flex-wrap items-center gap-2">
            <button type="button" id="schStatusNormalBtn" class="min-h-[44px] text-sm px-3 py-2 rounded-lg font-bold border transition">
              🟢 通常練習
            </button>
            <button type="button" id="schStatusOffBtn" class="min-h-[44px] text-sm px-3 py-2 rounded-lg font-bold border transition">
              🚫 練習休み（休講）
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">練習内容・持ち物・連絡事項（生徒・保護者へ公開）</label>
          <div class="flex flex-wrap gap-2">
            <input type="text" id="schDescInput" placeholder="例: 体育館シューズ持参 / JUMPトレーニング＆ゲーム" 
              class="w-full min-w-0 basis-full sm:flex-1 sm:basis-0 border border-slate-300 rounded-xl px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-slate-900 bg-white">
            <button id="saveScheduleBtn" class="min-h-[44px] bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold px-4 py-2 rounded-xl active:scale-95 transition shrink-0">
              予定を保存
            </button>
            <div class="relative shrink-0">
              <button type="button" id="copyScheduleBtn" class="min-h-[44px] bg-white hover:bg-slate-100 text-slate-800 text-sm font-bold px-3 py-2 rounded-xl border border-slate-300 active:scale-95 transition">
                📋 予定をコピー
              </button>
              <div id="copyScheduleMenu" class="hidden absolute left-0 sm:left-auto sm:right-0 mt-1 z-20 w-[min(16rem,calc(100vw-2rem))] max-w-full bg-white border border-slate-200 rounded-xl shadow-lg overflow-hidden">
                <button type="button" data-copy="next-week" class="copy-option w-full text-left px-3 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 border-b border-slate-100">
                  翌週の同じ曜日（+7日後）にコピー
                </button>
                <button type="button" data-copy="week" class="copy-option w-full text-left px-3 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50">
                  向こう1週間（7日間）すべてに同じ内容をコピー
                </button>
              </div>
            </div>
          </div>
        </div>

        <div id="dayOffBanner" class="hidden p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-700 text-xs font-bold flex items-center gap-2">
          <span>⚠️</span> この日は【練習休み】に設定されています。生徒・保護者画面にも大きく休みと表示されます。
        </div>
      </div>

      <!-- 集計バッジ -->
      <div class="grid grid-cols-3 gap-3 pt-2 border-t border-slate-100 w-full min-w-0 overflow-x-auto">
        <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-3 text-center">
          <div class="text-xs text-emerald-700 font-bold">⭕ 出席</div>
          <div id="attendCount" class="text-2xl font-black text-emerald-800">0</div>
        </div>
        <div class="bg-rose-50 border border-rose-200 rounded-xl p-3 text-center">
          <div class="text-xs text-rose-700 font-bold">❌ 欠席</div>
          <div id="absentCount" class="text-2xl font-black text-rose-800">0</div>
        </div>
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-center">
          <div class="text-xs text-slate-500 font-bold">合計回答</div>
          <div id="totalCount" class="text-2xl font-black text-slate-700">0</div>
        </div>
      </div>
    </section>

    <!-- 出席者・欠席者リスト -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- 出席者リスト -->
      <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
        <div class="bg-emerald-600 text-white px-4 py-3 flex items-center justify-between">
          <h2 class="font-bold text-sm flex items-center gap-1.5">
            <span>⭕</span> 出席メンバー
          </h2>
          <span id="attendHeaderBadge" class="text-xs bg-emerald-700 px-2 py-0.5 rounded-full font-bold">0名</span>
        </div>
        <div id="attendList" class="p-3 divide-y divide-slate-100 flex-1 min-h-[160px]">
          <div class="p-6 text-center text-slate-400 text-xs">出席の回答はありません</div>
        </div>
      </section>

      <!-- 欠席者リスト -->
      <section class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
        <div class="bg-rose-600 text-white px-4 py-3 flex items-center justify-between">
          <h2 class="font-bold text-sm flex items-center gap-1.5">
            <span>❌</span> 欠席メンバー
          </h2>
          <span id="absentHeaderBadge" class="text-xs bg-rose-700 px-2 py-0.5 rounded-full font-bold">0名</span>
        </div>
        <div id="absentList" class="p-3 divide-y divide-slate-100 flex-1 min-h-[160px]">
          <div class="p-6 text-center text-slate-400 text-xs">欠席の連絡はありません</div>
        </div>
      </section>

    </div>

  </main>

  <div id="copyConfirmModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-md shrink-0 rounded-2xl p-5 space-y-4 shadow-xl">
      <p id="copyConfirmText" class="text-sm font-bold text-slate-800 leading-relaxed"></p>
      <div class="grid grid-cols-2 gap-2">
        <button type="button" id="copyConfirmCancel" class="py-2.5 rounded-xl border border-slate-300 text-sm font-bold text-slate-700 hover:bg-slate-50">キャンセル</button>
        <button type="button" id="copyConfirmOk" class="py-2.5 rounded-xl bg-slate-900 text-white text-sm font-bold hover:bg-slate-800">コピーする</button>
      </div>
    </div>
  </div>

  <!-- 手動代理登録モーダル -->
  <div id="manualModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-md shrink-0 rounded-2xl p-5 space-y-4 shadow-xl">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-slate-800 text-sm">出欠の代理登録・上書き</h3>
        <button id="closeManualModalBtn" class="text-slate-400 hover:text-slate-600 text-lg leading-none font-bold">&times;</button>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">生徒氏名</label>
        <input type="text" id="manualNameInput" list="allStudentNames" placeholder="例: 津守 堅心" 
          class="w-full min-w-0 border border-slate-300 rounded-xl px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-slate-900 font-bold">
        <datalist id="allStudentNames"></datalist>
      </div>

      <div class="grid grid-cols-2 gap-3 w-full min-w-0 overflow-x-auto">
        <button type="button" data-val="出席" class="manual-status-btn min-h-[48px] py-2.5 border-2 border-emerald-500 text-emerald-700 rounded-xl font-bold flex items-center justify-center gap-1 hover:bg-emerald-50">
          <span>⭕ 出席</span>
        </button>
        <button type="button" data-val="欠席" class="manual-status-btn min-h-[48px] py-2.5 border-2 border-rose-400 text-rose-600 rounded-xl font-bold flex items-center justify-center gap-1 hover:bg-rose-50">
          <span>❌ 欠席</span>
        </button>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">メモ / 理由</label>
        <input type="text" id="manualNoteInput" placeholder="例: 練習中に体調不良 / 口頭連絡あり" 
          class="w-full min-w-0 border border-slate-300 rounded-xl px-3 py-2.5 text-base focus:outline-none focus:ring-2 focus:ring-slate-900">
      </div>

      <button id="submitManualBtn" class="w-full min-h-[48px] bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl active:scale-95 transition">
        保存して反映
      </button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAZCVAqpOXMjoKTz99netnxcsr2Yts8Rso",
      authDomain: "attendance-app-3092a.firebaseapp.com",
      projectId: "attendance-app-3092a",
      storageBucket: "attendance-app-3092a.firebasestorage.app",
      messagingSenderId: "1049451840444",
      appId: "1:1049451840444:web:04d60e7e1f486cbffaa633"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let attendanceMap = {};
    let schedulesMap = {};
    let currentScheduleStatus = '通常練習';
    let manualSelectedStatus = '出席';
    let scheduleFormDirty = false;

    function formatDate(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function normalizeName(name) {
      return (name || '').replace(/[\s\u3000]+/g, '').trim();
    }

    function showToast(msg, isError = false) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `p-3 rounded-xl shadow-lg border text-xs font-bold pointer-events-auto flex items-start gap-2 ${
        isError ? 'bg-rose-900 text-rose-100 border-rose-700' : 'bg-slate-900 text-white border-slate-700'
      }`;
      const icon = document.createElement('span');
      icon.textContent = isError ? '⚠️' : '✅';
      const text = document.createElement('span');
      text.className = 'leading-relaxed';
      text.textContent = msg;
      toast.append(icon, text);
      container.appendChild(toast);
      setTimeout(() => toast.remove(), isError ? 8000 : 3500);
    }

    function normalizeDateKey(val) {
      if (!val) return '';
      const s = String(val).trim().replace(/\//g, '-');
      const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
      return s;
    }

    function timestampText(value) {
      if (!value) return '';
      if (typeof value === 'string') return value;
      const date = value.toDate ? value.toDate() : null;
      if (!date || Number.isNaN(date.getTime())) return '';
      const pad = (n) => String(n).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function schedulePayload(date, status, description) {
      return {
        date: date,
        status: status,
        description: description || '',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
    }

    async function saveSchedule(date, status, description) {
      const dateStr = normalizeDateKey(date);
      await db.collection('schedules').doc(dateStr).set(schedulePayload(dateStr, status, description));
    }

    async function saveAttendance(name, date, status, note, source) {
      const normalizedName = normalizeName(name);
      const dateStr = normalizeDateKey(date);
      await db.collection('attendance').doc(`${normalizedName}_${dateStr}`).set({
        name: name,
        normalizedName: normalizedName,
        date: dateStr,
        status: status,
        note: note || '',
        source: source,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }

    function startLiveSync() {
      db.collection('schedules').onSnapshot((snap) => {
        const next = {};
        snap.forEach(doc => {
          const item = doc.data() || {};
          const date = normalizeDateKey(item.date || doc.id);
          if (!date) return;
          next[date] = {
            date: date,
            status: item.status || '通常練習',
            description: item.description || ''
          };
        });
        schedulesMap = next;
        renderDashboard();
      }, (err) => {
        console.error(err);
        showToast('予定を読み込めませんでした。通信環境を確認してください。', true);
      });

      db.collection('attendance').onSnapshot((snap) => {
        const next = {};
        snap.forEach(doc => {
          const item = doc.data() || {};
          if (!item.name) return;
          const date = normalizeDateKey(item.date);
          next[doc.id] = {
            ...item,
            date: date,
            updatedAt: timestampText(item.updatedAt)
          };
        });
        attendanceMap = next;
        populateDatalist();
        renderDashboard();
      }, (err) => {
        console.error(err);
        showToast('出欠を読み込めませんでした。通信環境を確認してください。', true);
      });
    }

    function populateDatalist() {
      const dl = document.getElementById('allStudentNames');
      dl.innerHTML = '';
      const names = new Set();
      Object.values(attendanceMap).forEach(item => {
        if (item && item.name) names.add(item.name);
      });
      names.forEach(n => {
        const opt = document.createElement('option');
        opt.value = n;
        dl.appendChild(opt);
      });
    }

    function updateScheduleUI() {
      const normalBtn = document.getElementById('schStatusNormalBtn');
      const offBtn = document.getElementById('schStatusOffBtn');
      const offBanner = document.getElementById('dayOffBanner');

      if (currentScheduleStatus === '休み') {
        offBtn.className = 'min-h-[44px] text-sm px-3 py-2 rounded-lg font-bold border bg-rose-600 text-white border-rose-700 shadow-sm';
        normalBtn.className = 'min-h-[44px] text-sm px-3 py-2 rounded-lg font-bold border bg-white text-slate-600 border-slate-300 hover:bg-slate-100';
        offBanner.classList.remove('hidden');
      } else {
        normalBtn.className = 'min-h-[44px] text-sm px-3 py-2 rounded-lg font-bold border bg-emerald-600 text-white border-emerald-700 shadow-sm';
        offBtn.className = 'min-h-[44px] text-sm px-3 py-2 rounded-lg font-bold border bg-white text-slate-600 border-slate-300 hover:bg-slate-100';
        offBanner.classList.add('hidden');
      }
    }

    let lastRenderedDate = '';

    function renderDashboard() {
      const selectedDate = document.getElementById('targetDatePicker').value;
      if (!selectedDate) return;

      if (selectedDate !== lastRenderedDate) {
        scheduleFormDirty = false;
        lastRenderedDate = selectedDate;
      }

      if (!scheduleFormDirty) {
        const schedule = schedulesMap[selectedDate];
        if (schedule) {
          currentScheduleStatus = schedule.status;
          document.getElementById('schDescInput').value = schedule.description || '';
        } else {
          currentScheduleStatus = '通常練習';
          document.getElementById('schDescInput').value = '';
        }
      }
      updateScheduleUI();

      const attendListEl = document.getElementById('attendList');
      const absentListEl = document.getElementById('absentList');
      let attends = [];
      let absents = [];

      Object.values(attendanceMap).forEach(item => {
        if (item && item.date === selectedDate) {
          if (item.status === '出席') attends.push(item);
          else if (item.status === '欠席') absents.push(item);
        }
      });

      document.getElementById('attendCount').textContent = attends.length;
      document.getElementById('absentCount').textContent = absents.length;
      document.getElementById('totalCount').textContent = attends.length + absents.length;
      document.getElementById('attendHeaderBadge').textContent = `${attends.length}名`;
      document.getElementById('absentHeaderBadge').textContent = `${absents.length}名`;

      if (attends.length === 0) {
        attendListEl.innerHTML = '<div class="p-6 text-center text-slate-400 text-xs">出席の回答はありません</div>';
      } else {
        attendListEl.innerHTML = '';
        attends.forEach(item => attendListEl.appendChild(createMemberCard(item)));
      }

      if (absents.length === 0) {
        absentListEl.innerHTML = '<div class="p-6 text-center text-slate-400 text-xs">欠席の連絡はありません</div>';
      } else {
        absentListEl.innerHTML = '';
        absents.forEach(item => absentListEl.appendChild(createMemberCard(item)));
      }
    }

    function createMemberCard(item) {
      const el = document.createElement('div');
      el.className = 'py-2.5 px-2 flex flex-col gap-1 hover:bg-slate-50 transition rounded-lg';

      let sourceLabel = '';
      if (item.source === 'parent') {
        sourceLabel = '<span class="text-[10px] bg-indigo-50 text-indigo-700 border border-indigo-200 px-1.5 py-0.5 rounded font-bold">保護者</span>';
      } else if (item.source === 'student') {
        sourceLabel = '<span class="text-[10px] bg-amber-50 text-amber-700 border border-amber-200 px-1.5 py-0.5 rounded font-bold">本人</span>';
      } else if (item.source === 'coach') {
        sourceLabel = '<span class="text-[10px] bg-slate-100 text-slate-700 border border-slate-300 px-1.5 py-0.5 rounded font-bold">指導者</span>';
      }

      const noteBlock = item.note 
        ? `<div class="text-xs bg-amber-50 text-amber-900 border border-amber-200 px-2 py-1 rounded mt-1 font-medium">💬 ${item.note}</div>`
        : '';

      el.innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-1 min-w-0">
          <div class="flex flex-wrap items-center gap-1.5 min-w-0">
            <span class="text-sm font-bold text-slate-800 break-words">${item.name}</span>
            ${sourceLabel}
          </div>
          <span class="text-[10px] text-slate-400">${item.updatedAt ? item.updatedAt.slice(11, 16) : ''}</span>
        </div>
        ${noteBlock}
      `;
      return el;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const picker = document.getElementById('targetDatePicker');
      picker.value = formatDate(new Date());

      picker.addEventListener('change', renderDashboard);

      document.getElementById('setTodayBtn').addEventListener('click', () => {
        picker.value = formatDate(new Date());
        renderDashboard();
      });

      document.getElementById('setTomorrowBtn').addEventListener('click', () => {
        const d = new Date();
        d.setDate(d.getDate() + 1);
        picker.value = formatDate(d);
        renderDashboard();
      });

      document.getElementById('refreshBtn').addEventListener('click', () => {
        const refreshBtn = document.getElementById('refreshBtn');
        refreshBtn.classList.add('opacity-50');
        renderDashboard();
        setTimeout(() => refreshBtn.classList.remove('opacity-50'), 200);
      });

      document.getElementById('schDescInput').addEventListener('input', () => {
        scheduleFormDirty = true;
      });

      document.getElementById('schStatusNormalBtn').addEventListener('click', () => {
        currentScheduleStatus = '通常練習';
        scheduleFormDirty = true;
        updateScheduleUI();
      });

      document.getElementById('schStatusOffBtn').addEventListener('click', () => {
        currentScheduleStatus = '休み';
        scheduleFormDirty = true;
        updateScheduleUI();
      });

      function addDays(dateStr, days) {
        const parts = String(dateStr).split('-').map(Number);
        const d = new Date(parts[0], parts[1] - 1, parts[2]);
        d.setDate(d.getDate() + days);
        return formatDate(d);
      }

      function closeCopyMenu() {
        document.getElementById('copyScheduleMenu').classList.add('hidden');
      }

      function askCopyConfirm(message) {
        return new Promise(resolve => {
          const modal = document.getElementById('copyConfirmModal');
          document.getElementById('copyConfirmText').textContent = message;
          modal.classList.remove('hidden');
          modal.classList.add('flex');
          const okBtn = document.getElementById('copyConfirmOk');
          const cancelBtn = document.getElementById('copyConfirmCancel');
          const finish = (value) => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            okBtn.onclick = null;
            cancelBtn.onclick = null;
            resolve(value);
          };
          okBtn.onclick = () => finish(true);
          cancelBtn.onclick = () => finish(false);
        });
      }

      document.getElementById('copyScheduleBtn').addEventListener('click', (event) => {
        event.stopPropagation();
        document.getElementById('copyScheduleMenu').classList.toggle('hidden');
      });

      document.addEventListener('click', (event) => {
        if (!event.target.closest('#copyScheduleMenu') && event.target.id !== 'copyScheduleBtn') {
          closeCopyMenu();
        }
      });

      document.querySelectorAll('.copy-option').forEach(option => {
        option.addEventListener('click', async () => {
          const sourceDate = picker.value;
          if (!sourceDate) return;
          const desc = document.getElementById('schDescInput').value.trim();
          const status = currentScheduleStatus;
          const targets = option.dataset.copy === 'next-week'
            ? [addDays(sourceDate, 7)]
            : Array.from({ length: 7 }, (_, i) => addDays(sourceDate, i));
          const rangeLabel = targets.length === 1
            ? `来週 ${targets[0]}`
            : `${targets[0]} から ${targets[targets.length - 1]} の7日間`;
          closeCopyMenu();
          const ok = await askCopyConfirm(`${sourceDate} の練習内容を、${rangeLabel}にコピーして保存しますか？`);
          if (!ok) return;

          const btn = document.getElementById('copyScheduleBtn');
          btn.disabled = true;
          btn.textContent = 'コピー保存中...';
          try {
            const batch = db.batch();
            targets.forEach(date => {
              const dateStr = normalizeDateKey(date);
              batch.set(db.collection('schedules').doc(dateStr), schedulePayload(dateStr, status, desc));
            });
            await batch.commit();
            showToast('コピーが完了しました！');
          } catch (err) {
            console.error(err);
            showToast('コピーに失敗しました。通信環境を確認してください。', true);
          } finally {
            btn.disabled = false;
            btn.textContent = '📋 予定をコピー';
          }
        });
      });

      // 予定保存
      document.getElementById('saveScheduleBtn').addEventListener('click', async () => {
        const date = picker.value;
        const desc = document.getElementById('schDescInput').value.trim();
        const btn = document.getElementById('saveScheduleBtn');

        btn.disabled = true;
        btn.innerText = '保存中...';

        try {
          await saveSchedule(date, currentScheduleStatus, desc);
          scheduleFormDirty = false;
          showToast(`${date} の練習予定を保存しました！`);
        } catch (err) {
          console.error(err);
          showToast('予定の保存に失敗しました。通信環境を確認してください。', true);
        } finally {
          btn.disabled = false;
          btn.innerText = '予定を保存';
        }
      });

      // 代理モーダル
      const manualModal = document.getElementById('manualModal');
      document.getElementById('openManualModalBtn').addEventListener('click', () => {
        manualModal.classList.remove('hidden');
      });
      document.getElementById('closeManualModalBtn').addEventListener('click', () => {
        manualModal.classList.add('hidden');
      });

      document.querySelectorAll('.manual-status-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          manualSelectedStatus = btn.dataset.val;
          document.querySelectorAll('.manual-status-btn').forEach(b => {
            b.classList.toggle('ring-2', b.dataset.val === manualSelectedStatus);
          });
        });
      });

      document.getElementById('submitManualBtn').addEventListener('click', async () => {
        const name = document.getElementById('manualNameInput').value.trim();
        const note = document.getElementById('manualNoteInput').value.trim();
        const date = picker.value;
        const btn = document.getElementById('submitManualBtn');

        if (!name) return showToast('生徒名を入力してください。', true);

        btn.disabled = true;
        btn.innerText = '登録中...';

        try {
          await saveAttendance(name, date, manualSelectedStatus, note, 'coach');
          manualModal.classList.add('hidden');
          document.getElementById('manualNameInput').value = '';
          document.getElementById('manualNoteInput').value = '';
          showToast(`${name} さんの出欠を保存しました！`);
        } catch (err) {
          console.error(err);
          showToast('登録に失敗しました。通信環境を確認してください。', true);
        } finally {
          btn.disabled = false;
          btn.innerText = '保存して反映';
        }
      });

      startLiveSync();
    });
  </script>
</body>
</html>
